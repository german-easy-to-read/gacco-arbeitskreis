# Site settings -----------------------------------------------------------
title: "Arbeitskreis GACCO"
subtitle: "German Accessible Communication"
email:
description: >-
  Der Arbeitskreis German Accessible Communication (GACCO) vernetzt
  Forschende und Praktiker:innen im Bereich der barrierefreien
  Kommunikation im deutschsprachigen Raum.
locale: "de-DE"
default_lang: "de"          # Standardsprache, siehe _data/i18n.yml
# url: "https://<organisation>.github.io"   # ohne abschliessenden Slash
# baseurl: "/gacco-arbeitskreis"            # nur noetig bei Project Pages
minimal_mistakes_skin: default
search: true

# Build settings ----------------------------------------------------------
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
permalink: /news/:year/:title/
timezone: Europe/Berlin

include:
  - _pages

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache

# Wird vom Theme u. a. fuer die Seiten-Metadaten verwendet.
author:
  name: "Arbeitskreis GACCO"

footer:
  links:
    - label: "Kontakt"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:yingqiang.gao@uzh.ch?cc=miriam.anschuetz@iued.uni-heidelberg.de,regina.stodden@uni-bielefeld.de,Thorben.Schomacker@haw-hamburg.de&subject=GACCO"

defaults:
  # Standardsprache fuer alle Inhalte
  - scope:
      path: ""
    values:
      lang: "de"
  # Englische Inhalte liegen unter en/
  - scope:
      path: "en"
    values:
      lang: "en"
      locale: "en-US"
  - scope:
      path: "en"
      type: posts
    values:
      permalink: /en/news/:year/:title/
  # Newsbeitraege
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      read_time: false
      comments: false
      share: false
      related: false
  # Seiten
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: false
